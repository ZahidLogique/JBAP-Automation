name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Test scope to run"
        required: true
        default: "e2e"
        type: choice
        options:
          - e2e
          - backoffice
          - all

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Create .env
        run: |
          cat <<EOF > .env
          WEB_URL=${{ secrets.WEB_URL }}
          BACKOFFICE_URL=${{ secrets.BACKOFFICE_URL }}
          BASIC_AUTH_USER=${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS=${{ secrets.BASIC_AUTH_PASS }}
          ADMIN_USER=${{ secrets.ADMIN_USER }}
          ADMIN_PASS=${{ secrets.ADMIN_PASS }}
          TEST_SEQUENTIAL=true
          PLAYWRIGHT_HEADLESS=true
          EOF

      - name: Run Allure pretest scripts
        run: npm run pretest

      - name: Run tests
        run: |
          if [ "${{ inputs.test_scope }}" = "e2e" ]; then
            npx playwright test --project=backoffice-e2e --project=auction --project=e2e-cleanup
          elif [ "${{ inputs.test_scope }}" = "backoffice" ]; then
            npx playwright test --project=backoffice
          else
            npx playwright test
          fi
        env:
          CI: true

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.json
            test-results/
          retention-days: 7
