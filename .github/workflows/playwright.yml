name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Create .env
        run: |
          echo "WEB_URL=${{ secrets.WEB_URL }}" >> .env
          echo "BACKOFFICE_URL=${{ secrets.BACKOFFICE_URL }}" >> .env
          echo "BASIC_AUTH_USER=${{ secrets.BASIC_AUTH_USER }}" >> .env
          echo "BASIC_AUTH_PASS=${{ secrets.BASIC_AUTH_PASS }}" >> .env
          echo "ADMIN_USER=${{ secrets.ADMIN_USER }}" >> .env
          echo "ADMIN_PASS=${{ secrets.ADMIN_PASS }}" >> .env
          echo "TEST_SEQUENTIAL=true" >> .env
          echo "PLAYWRIGHT_HEADLESS=true" >> .env

      - run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
